<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OpenPunnett</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

<head>
  <link rel="stylesheet" href="style.css">
</head>

</head>

<body>

<div class="side-panel">
  <div class="app-header">
    <h1>OpenPunnett Calculator</h1>
    <h2 id="title" style="display:none;"></h2>
  </div>
  
  <div id="history"></div>
</div>

<div class="container">

  <input id="p1" placeholder="">
  <input id="p2" placeholder="">
  <br>

  <a href="https://github.com/ShadowDev7/OpenPunnett" class="github-link" target="_blank" aria-label="GitHub Profile">
    <svg viewBox="0 0 16 16" width="28" height="28" fill="currentColor">
      <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
    </svg>
  </a>

  <div class="button-group">
    <button onclick="calculate()" id="btn1"></button>
    <button onclick="explain()" id="btn2"></button>
    <button onclick="exportData()" id="btn3"></button>
  </div>

  <div id="output"></div>
  <div id="ai"></div>

  <div class="lang-switch" onclick="toggleLang()">
    <div class="thumb" id="thumb">🇬🇷</div>
  </div>

  <div class="footer">
    <a href="https://github.com/ShadowDev7/OpenPunnett/releases" target="_blank" class="download-link">
      <span class="material-symbols-outlined" style="font-size: 18px;">desktop_windows</span>
      Download Desktop Here
    </a>
  </div>

    
    <div class="credit-badge">
      Developed by <a href="https://github.com/ShadowDev7" target="_blank">ShadowDev7</a> and <a href="https://github.com/Krikonis11" target="_blank">Krikonis11</a>
    </div>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
