<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OpenPunnett</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #999494, #c5c3ce);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.github-link {
    position: fixed;
    top: 2rem;
    right: 2rem;
    color: rgba(255, 255, 255, 0.4);
    transition: all 0.3s ease;
    z-index: 100;
}

.github-link:hover {
    color: #ffffff;
    transform: scale(1.1);
}

.container {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  padding: 25px;
  border-radius: 25px;
  width: 92%;
  max-width: 750px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

input {
  padding: 12px;
  margin: 6px;
  border-radius: 12px;
  border: none;
  width: 40%;
  font-size: 16px;
}

button {
  margin-top: 10px;
  padding: 12px 22px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg,#00c6ff,#0072ff);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

table {
  margin: 20px auto;
  border-collapse: collapse;
  border-radius: 12px;
  overflow: hidden;
}

td, th {
  border: 1px solid rgba(255,255,255,0.2);
  padding: 14px;
  width: 60px;
  height: 60px;
  background: rgba(255,255,255,0.1);
}

.result {
  margin-top: 15px;
  padding: 15px;
  background: rgba(0,0,0,0.25);
  border-radius: 15px;
}

.bar-container {
  margin-top: 10px;
  text-align: left;
}

.bar {
  height: 18px;
  background: linear-gradient(90deg,#00c6ff,#0072ff);
  border-radius: 10px;
  margin: 5px 0;
}

/* LANG SWITCH */
.lang-switch {
  width: 75px;
  height: 36px;
  margin: 20px auto 10px;
  border-radius: 50px;
  background: rgba(255,255,255,0.2);
  cursor: pointer;
  display: flex;
  align-items: center;
  padding: 3px;
}

.thumb {
  width: 30px;
  height: 30px;
  background: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.35s;
}

/* FOOTER */
.footer {
  margin-top: 10px;
  font-size: 13px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="container">

  <div style="text-align:center;">
    <h1>OpenPunnett Calculator</h1>
    <h2 id="title"></h2>
  </div>

<input id="p1" placeholder="">
<input id="p2" placeholder="">
<br>


<a href="https://github.com/ShadowDev7/OpenPunnett" class="github-link" target="_blank"
        aria-label="GitHub Profile">
        <svg viewBox="0 0 16 16" width="32" height="32" fill="currentColor">
            <path
                d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z">
            </path>
        </svg>
    </a>

<button onclick="calculate()" id="btn1"></button>
<button onclick="explain()" id="btn2"></button>
<button onclick="exportData()" id="btn3"></button>

<div id="output"></div>
<div id="ai"></div>

<!-- LANG -->
<div class="lang-switch" onclick="toggleLang()">
  <div class="thumb" id="thumb">🇬🇷</div>
</div>

<div id="history"></div>

<div class="footer">Site Made By <a href="https://github.com/Krikonis11" target="_blank" style="color: inherit; text-decoration: underline;">Nikolas Krikonis</a></div>

</div>

<script>

let lang = "el";

/* TEXTS */
const t = {
 el: {
  title:"",                                                          
  p1:"Γονέας 1 (π.χ. Aa / Αα)",
  p2:"Γονέας 2 (π.χ. Aa / Αα)",
  calc:"Υπολογισμός",
  explain:"Εξήγηση",
  export:"Export",
  error:"Λάθος γονότυπος",
  validError:"Πρέπει να είναι AA, Aa, aA, aa (ή ελληνικά Α/α)",
  results:"Αποτελέσματα",
  ai:"🧠 Εξήγηση"
 },
 en: {
  title:"",
  p1:"Parent 1 (e.g. Aa)",  
  p2:"Parent 2 (e.g. Aa)",
  calc:"Calculate",
  explain:"Explain",
  export:"Export",
  error:"Invalid genotype",
  validError:"Must be AA, Aa, aA, aa (or Greek Α/α)",
  results:"Results",
  ai:"🧠 Explanation"
 }
};

/* Normalize Greek letters */
function normalizeGenotype(g){
  return g
    .replace(/Α/g, "A")
    .replace(/α/g, "a");
}

/* apply language */
function applyLang(){
 document.getElementById("title").innerText = t[lang].title;
 document.getElementById("p1").placeholder = t[lang].p1;
 document.getElementById("p2").placeholder = t[lang].p2;
 document.getElementById("btn1").innerText = t[lang].calc;
 document.getElementById("btn2").innerText = t[lang].explain;
 document.getElementById("btn3").innerText = t[lang].export;

 document.getElementById("output").innerHTML="";
 document.getElementById("ai").innerHTML="";
}

/* switch */
function toggleLang(){
 const thumb = document.getElementById("thumb");

 if (lang==="el"){
   lang="en";
   thumb.style.transform="translateX(38px)";
   thumb.innerText="🇬🇧";
 } else {
   lang="el";
   thumb.style.transform="translateX(0)";
   thumb.innerText="🇬🇷";
 }

 applyLang();
}

/* combine */
function combine(a,b){
 return (a+b).split("").sort().join("");
}

/* calculate */
function calculate(){

 let p1 = document.getElementById("p1").value.trim();
 let p2 = document.getElementById("p2").value.trim();

 /* convert Greek → Latin */
 p1 = normalizeGenotype(p1);
 p2 = normalizeGenotype(p2);

 const valid = ["AA","Aa","aA","aa"];

 if(!valid.includes(p1) || !valid.includes(p2)) {
   alert(t[lang].validError);
   return;
 }

 const g1=[...p1];
 const g2=[...p2];

 let counts={};
 let html="<table><tr><th></th>";

 for(let j=0;j<g2.length;j++){
  html+=`<th>${g2[j]}</th>`;
 }
 html+="</tr>";

 for(let i=0;i<g1.length;i++){
  html+=`<tr><th>${g1[i]}</th>`;
  for(let j=0;j<g2.length;j++){
    let c=combine(g1[i],g2[j]);
    html+=`<td>${c}</td>`;
    counts[c]=(counts[c]||0)+1;
  }
  html+="</tr>";
 }

 html+="</table>";

 let total=Object.values(counts).reduce((a,b)=>a+b,0);

 let bars="<div class='bar-container'>";

 for(let k in counts){
   let p=(counts[k]/total*100);
   bars+=`<div>${k} - ${p.toFixed(0)}%</div>`;
   bars+=`<div class='bar' style='width:${p*3}px'></div>`;
 }

 bars+="</div>";

 document.getElementById("output").innerHTML =
 `<div class='result'><h3>${t[lang].results}</h3></div>` + html + bars;

 saveHistory(p1,p2);
}

/* explain */
function explain(){

 let p1 = document.getElementById("p1").value.trim();
 let p2 = document.getElementById("p2").value.trim();

 p1 = normalizeGenotype(p1);
 p2 = normalizeGenotype(p2);

 const valid = ["AA","Aa","aA","aa"];

 if(!valid.includes(p1) || !valid.includes(p2)){
   alert(t[lang].validError);
   return;
 }

 let meaning = {
  AA: lang==="el"?"ομόζυγος κυρίαρχος":"homozygous dominant",
  Aa: lang==="el"?"ετερόζυγος":"heterozygous",
  aA: lang==="el"?"ετερόζυγος":"heterozygous",
  aa: lang==="el"?"ομόζυγος υπολειπόμενος":"homozygous recessive"
 };

 document.getElementById("ai").innerHTML =
 `<div class="result">
   <h3>${t[lang].ai}</h3>
   <p>${p1}: ${meaning[p1]}</p>
   <p>${p2}: ${meaning[p2]}</p>
 </div>`;
}

/* export */
function exportData() {

 const p1 = normalizeGenotype(document.getElementById("p1").value);
 const p2 = normalizeGenotype(document.getElementById("p2").value);

 const output = document.getElementById("output").innerText;
 const ai = document.getElementById("ai").innerText;

 let content =
 `Punnett Pro Export
-------------------
Parent 1: ${p1}
Parent 2: ${p2}

RESULTS:
${output}

EXPLANATION:
${ai}
`;

 const blob = new Blob([content], {type:"text/plain"});
 const url = URL.createObjectURL(blob);

 const a = document.createElement("a");
 a.href = url;
 a.download = "punnett-results.txt";
 a.click();

 URL.revokeObjectURL(url);
}

/* history */
function saveHistory(p1,p2){
 let h = JSON.parse(localStorage.getItem("h")||"[]");
 h.unshift(`${p1} × ${p2}`);
 h = h.slice(0,5);
 localStorage.setItem("h",JSON.stringify(h));

 document.getElementById("history").innerHTML =
 "<b>History:</b><br>"+h.join("<br>");
}

window.onload=applyLang;

</script>

</body>
</html>
